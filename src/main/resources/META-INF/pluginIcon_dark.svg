<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E4CF0"/>
      <stop offset="100%" stop-color="#3E2CC4"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#tileGrad)"/>
  <rect x="0" y="0" width="512" height="256" rx="108" fill="#FFFFFF" opacity="0.04"/>

  <!-- App screen frame -->
  <g transform="translate(256,246)">
    <rect x="-108" y="-140" width="216" height="280" rx="30" fill="none" stroke="#FFFFFF" stroke-width="16"/>
    <!-- camera notch -->
    <rect x="-16" y="-140" width="32" height="8" rx="4" fill="#FFFFFF"/>

    <!-- app content lines (top of screen) -->
    <rect x="-72" y="-100" width="100" height="12" rx="6" fill="#FFFFFF" opacity="0.9"/>
    <rect x="-72" y="-74" width="144" height="12" rx="6" fill="#FFFFFF" opacity="0.55"/>
    <rect x="-72" y="-48" width="120" height="12" rx="6" fill="#FFFFFF" opacity="0.55"/>

    <!-- divider where ad docks in, drawn as a socket notch -->
    <path d="M -80 6 L -22 6 L -14 -8 L 14 -8 L 22 6 L 80 6"
          fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" opacity="0.85"/>

    <!-- Ad bar docking into the socket from below -->
    <g transform="translate(0,52)">
      <rect x="-80" y="-30" width="160" height="60" rx="14" fill="#FFC94D"/>
      <!-- plug tab rising to meet the socket notch -->
      <path d="M -14 -30 L -8 -44 L 8 -44 L 14 -30 Z" fill="#FFC94D"/>
      <text x="0" y="10" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" fill="#4433C8">AD</text>
    </g>
  </g>
</svg>
